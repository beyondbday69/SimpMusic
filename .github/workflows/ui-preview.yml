name: Build & Preview SimpMusic

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  build-and-preview:
    name: Build APK & Verify UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup local.properties
        run: |
          touch ./local.properties
          echo 'SENTRY_DSN=""' >> ./local.properties
          echo "SENTRY_AUTH_TOKEN=" >> ./local.properties
          echo "LASTFM_API_KEY=" >> ./local.properties
          echo "LASTFM_SECRET=" >> ./local.properties
          echo "sdk.dir=$ANDROID_HOME" >> ./local.properties

      - name: Export Library Definitions
        run: ./gradlew exportLibraryDefinitions

      - name: Compile and Verify Compose UI
        run: ./gradlew :composeApp:compileKotlinJvm

      - name: Build Android App (APK)
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.2.0-preview-$(date +'%Y%m%d%H%M%S')"
          gh release create "$TAG" androidApp/build/outputs/apk/debug/*.apk \
            --title "SimpMusic with Bottom Center Dock ($TAG)" \
            --notes "Downloadable Android APK with redesigned floating bottom-center dock and tablet layout optimizations." \
            --prerelease || true

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '**/build/reports/'
