name: Build & Preview SimpMusic

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: write
  actions: write

jobs:
  build-and-preview:
    name: Build APK & Verify UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Cache Gradle & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            setup-java-Linux-x64-gradle-

      - name: Setup local.properties
        run: |
          touch ./local.properties
          echo 'SENTRY_DSN=""' >> ./local.properties
          echo "SENTRY_AUTH_TOKEN=" >> ./local.properties
          echo "LASTFM_API_KEY=" >> ./local.properties
          echo "LASTFM_SECRET=" >> ./local.properties
          echo "sdk.dir=$ANDROID_HOME" >> ./local.properties

      - name: Export Library Definitions
        run: ./gradlew exportLibraryDefinitions

      - name: Build Android App (APK)
        run: |
          ./gradlew :androidApp:assembleRelease -x lint -x test

      - name: Locate Output APKs
        run: |
          if ls androidApp/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            echo "APK_FILES=androidApp/build/outputs/apk/release/*.apk" >> $GITHUB_ENV
            echo "BUILD_FLAVOR=release" >> $GITHUB_ENV
          else
            echo "APK_FILES=androidApp/build/outputs/apk/debug/*.apk" >> $GITHUB_ENV
            echo "BUILD_FLAVOR=debug" >> $GITHUB_ENV
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-arm64-apk
          path: ${{ env.APK_FILES }}
          if-no-files-found: error

      - name: Deploy Live In-Browser Preview (Appetize.io)
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN || 'tok_zju2qp2a6s6iak5zgyqeres2au' }}
          APPETIZE_PUBLIC_KEY: "xlbp5fcq67yo5d2amk2rqqcasi"
        run: |
          APK_FILE=$(ls ${{ env.APK_FILES }} | head -n 1)
          echo "Deploying $APK_FILE to Appetize.io..."
          RESP=$(curl -s -u "$APPETIZE_TOKEN:" \
            "https://api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY" \
            -F "file=@$APK_FILE" \
            -F "platform=android")
          echo "Appetize response: $RESP"
          PREVIEW_URL="https://appetize.io/app/$APPETIZE_PUBLIC_KEY"
          echo "APPETIZE_PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV
          echo "### 📱 Live In-Browser Interactive Preview" >> $GITHUB_STEP_SUMMARY
          echo "Test and interact with this build live in your browser without installing:" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Launch SimpMusic on Appetize.io]($PREVIEW_URL)**" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.2.0-preview-$(date +'%Y%m%d%H%M%S')"
          RELEASE_NOTES="### 📱 Live In-Browser Preview
          Test and interact with this build live without installing:
          👉 **[Launch SimpMusic on Appetize.io](${APPETIZE_PREVIEW_URL})**

          ### 📦 Download APK
          Fast, optimized ARM64-v8a release APK with unofficial app warning eliminated, zero-lag dock, thick M3 Expressive progress bar without dot, and smooth hardware-accelerated transitions."
          gh release create "$TAG" ${{ env.APK_FILES }} \
            --title "SimpMusic ARM64 Release ($TAG)" \
            --notes "$RELEASE_NOTES" \
            --prerelease || true

      - name: Clean Gradle Locks Before Caching
        if: always()
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/*/plugin-resolution/
          rm -f ~/.gradle/caches/journal-1/file-access.properties

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '**/build/reports/'
