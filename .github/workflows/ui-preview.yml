name: Build & Preview SimpMusic

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  build-and-preview:
    name: Build APK & Verify UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup local.properties
        run: |
          touch ./local.properties
          echo 'SENTRY_DSN=""' >> ./local.properties
          echo "SENTRY_AUTH_TOKEN=" >> ./local.properties
          echo "LASTFM_API_KEY=" >> ./local.properties
          echo "LASTFM_SECRET=" >> ./local.properties
          echo "sdk.dir=$ANDROID_HOME" >> ./local.properties

      - name: Export Library Definitions
        run: ./gradlew exportLibraryDefinitions

      - name: Compile and Verify Compose UI
        run: ./gradlew :composeApp:compileKotlinJvm

      - name: Build Android App (APK)
        run: |
          ./gradlew :androidApp:assembleRelease || ./gradlew :androidApp:assembleDebug

      - name: Locate Output APKs
        run: |
          if ls androidApp/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            echo "APK_FILES=androidApp/build/outputs/apk/release/*.apk" >> $GITHUB_ENV
            echo "BUILD_FLAVOR=release" >> $GITHUB_ENV
          else
            echo "APK_FILES=androidApp/build/outputs/apk/debug/*.apk" >> $GITHUB_ENV
            echo "BUILD_FLAVOR=debug" >> $GITHUB_ENV
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-arm64-apk
          path: ${{ env.APK_FILES }}
          if-no-files-found: error

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.2.0-preview-$(date +'%Y%m%d%H%M%S')"
          gh release create "$TAG" ${{ env.APK_FILES }} \
            --title "SimpMusic ARM64 Release ($TAG)" \
            --notes "Fast, optimized ARM64-v8a release APK with unofficial app warning eliminated, zero-lag dock, and smooth hardware-accelerated transitions." \
            --prerelease || true

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '**/build/reports/'
