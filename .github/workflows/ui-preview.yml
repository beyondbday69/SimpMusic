name: UI Previews & Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - 'composeApp/**'
      - 'core/**'
      - '.github/workflows/ui-preview.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'composeApp/**'
      - 'core/**'

jobs:
  ui-verification:
    name: Verify UI & Layouts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Export Library Definitions
        run: ./gradlew exportLibraryDefinitions

      - name: Compile and Verify Compose UI
        run: ./gradlew :composeApp:compileKotlinJvm :composeApp:compileDebugKotlinAndroid

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '**/build/reports/'
